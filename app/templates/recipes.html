{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestion des Recettes / إدارة الوصفات</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRecipeModal"><i class="fas fa-plus me-2"></i>Nouvelle Recette</button>
</div>

<div class="row g-4" id="recipesGrid">
    <!-- Recipes will be loaded here -->
</div>

<!-- Details Modal -->
<div class="modal fade" id="recipeDetailsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Détails de la Recette</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="recipeDetailsBody">
            </div>
        </div>
    </div>
</div>

<!-- Add Recipe Modal -->
<div class="modal fade" id="addRecipeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Ajouter une Recette</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addRecipeForm">
                    <div class="mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" id="recipeName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prix de vente</label>
                        <input type="number" class="form-control" id="recipePrice" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadRecipes() {
        const res = await fetch('/api/recipes');
        const data = await res.json();
        const grid = document.getElementById('recipesGrid');
        grid.innerHTML = data.recipes.map(r => `
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h5 class="card-title">${r.name}</h5>
                            <button class="btn btn-sm text-danger" onclick="deleteRecipe(${r.id})"><i class="fas fa-trash"></i></button>
                        </div>
                        <p class="card-text text-muted">${r.ingredients ? r.ingredients.length : 0} ingrédients</p>
                        <div class="h4 text-primary">${r.selling_price} DA</div>
                    </div>
                    <div class="card-footer bg-white border-0">
                        <div class="btn-group w-100">
                            <button class="btn btn-outline-primary btn-sm" onclick="viewRecipe(${r.id})">Détails</button>
                            <a href="/api/export/recipe/${r.id}/pdf" class="btn btn-outline-secondary btn-sm"><i class="fas fa-file-pdf"></i> PDF</a>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('addRecipeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('recipeName').value;
        const price = document.getElementById('recipePrice').value;
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
        const token = localStorage.getItem('token');

        const res = await fetch('/api/recipes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': csrfToken,
                'Authorization': token ? `Bearer ${token}` : ''
            },
            body: JSON.stringify({ name, selling_price: price })
        });

        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('addRecipeModal')).hide();
            loadRecipes();
        } else {
            alert('Erreur lors de l\'ajout');
        }
    });

    async function viewRecipe(id) {
        const res = await fetch(`/api/recipes/${id}`);
        const data = await res.json();
        const r = data.recipe;

        document.getElementById('recipeDetailsBody').innerHTML = `
            <div class="mb-3">
                <h4 class="text-primary">${r.name}</h4>
                <div class="h5">${r.selling_price.toLocaleString()} DA</div>
            </div>
            <hr>
            <h6>Rentabilité estimée</h6>
            <div class="d-flex justify-content-between mb-1">
                <span>Coût total:</span>
                <span>${(r.total_cost || 0).toLocaleString()} DA</span>
            </div>
            <div class="d-flex justify-content-between mb-1">
                <span>Profit/unité:</span>
                <span class="text-success">${(r.profit_per_unit || 0).toLocaleString()} DA</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
                <span>Marge:</span>
                <span class="badge bg-success">${(r.profit_margin || 0).toFixed(1)}%</span>
            </div>
            <hr>
            <h6>Ingrédients</h6>
            <ul class="list-group list-group-flush">
                ${r.ingredients ? r.ingredients.map(i => `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        ${i.name}
                        <span class="badge bg-light text-dark">${i.quantity} units</span>
                    </li>
                `).join('') : '<li class="list-group-item">Aucun ingrédient</li>'}
            </ul>
        `;
        new bootstrap.Modal(document.getElementById('recipeDetailsModal')).show();
    }

    async function deleteRecipe(id) {
        if (!confirm('Supprimer cette recette ?')) return;
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
        const token = localStorage.getItem('token');

        const res = await fetch(`/api/recipes/${id}`, {
            method: 'DELETE',
            headers: {
                'X-CSRF-Token': csrfToken,
                'Authorization': token ? `Bearer ${token}` : ''
            }
        });
        if (res.ok) loadRecipes();
    }

    loadRecipes();
</script>
{% endblock %}
