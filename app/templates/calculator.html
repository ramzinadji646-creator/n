{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Calculateur de Rentabilité</h2>

<div class="row g-4">
    <div class="col-lg-7">
        <div class="card p-4">
            <form id="calcForm">
                <div class="mb-3">
                    <label class="form-label">Nom du Produit</label>
                    <input type="text" class="form-control" id="productName" placeholder="ex: Gâteau Chocolat">
                </div>

                <h6 class="mt-4">Ingrédients</h6>
                <div id="ingredientsList">
                    <div class="row g-2 mb-2 ingredient-row">
                        <div class="col-6">
                            <input type="text" class="form-control" placeholder="Nom">
                        </div>
                        <div class="col-2">
                            <input type="number" class="form-control" placeholder="Qté">
                        </div>
                        <div class="col-3">
                            <input type="number" class="form-control" placeholder="Prix Pack">
                        </div>
                        <div class="col-1">
                            <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="removeRow(this)"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm mb-4" onclick="addRow()"><i class="fas fa-plus"></i> Ajouter Ingrédient</button>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Main d'œuvre (heures)</label>
                        <input type="number" step="0.1" class="form-control" id="laborHours" value="1">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Packaging (DA)</label>
                        <input type="number" class="form-control" id="packagingCost" value="100">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Prix de Vente (DA)</label>
                        <input type="number" class="form-control" id="sellingPrice" value="3500">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mode de Livraison</label>
                        <select class="form-select" id="deliveryMode">
                            <option value="Customer_Pays">Client Paye</option>
                            <option value="We_Pay">Nous Payons</option>
                            <option value="Free">Gratuit</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="btn btn-primary w-100 mt-4 py-2" onclick="calculate()">Calculer la Rentabilité</button>
            </form>
        </div>
    </div>

    <div class="col-lg-5">
        <div class="card p-4 h-100" id="resultsCard" style="display: none;">
            <h5 class="text-center mb-4">Résultats du Calcul</h5>
            <div class="d-flex justify-content-between mb-2">
                <span>Coût Total Variable:</span>
                <span class="fw-bold" id="resTotalCost">0 DA</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
                <span>Profit par Unité:</span>
                <span class="fw-bold text-success" id="resProfit">0 DA</span>
            </div>
            <div class="d-flex justify-content-between mb-4">
                <span>Marge de Profit:</span>
                <span class="badge bg-success" id="resMargin">0%</span>
            </div>
            <hr>
            <canvas id="resultChart"></canvas>
            <button class="btn btn-outline-success w-100 mt-4"><i class="fas fa-save me-2"></i> Sauvegarder comme Recette</button>
        </div>
        <div class="card p-4 h-100 d-flex align-items-center justify-content-center text-muted" id="emptyResults">
            <i class="fas fa-calculator display-4 mb-3"></i>
            <p>Entrez les données pour voir l'analyse</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function addRow() {
        const div = document.createElement('div');
        div.className = 'row g-2 mb-2 ingredient-row';
        div.innerHTML = `
            <div class="col-6"><input type="text" class="form-control" placeholder="Nom"></div>
            <div class="col-2"><input type="number" class="form-control" placeholder="Qté"></div>
            <div class="col-3"><input type="number" class="form-control" placeholder="Prix Pack"></div>
            <div class="col-1"><button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="removeRow(this)"><i class="fas fa-trash"></i></button></div>
        `;
        document.getElementById('ingredientsList').appendChild(div);
    }
    function removeRow(btn) {
        btn.closest('.ingredient-row').remove();
    }

    let myChart = null;

    async function calculate() {
        // Collect data
        const payload = {
            product_name: document.getElementById('productName').value,
            labor_hours: document.getElementById('laborHours').value,
            packaging_cost: document.getElementById('packagingCost').value,
            selling_price: document.getElementById('sellingPrice').value,
            delivery_mode: document.getElementById('deliveryMode').value,
            ingredients: []
        };

        document.querySelectorAll('.ingredient-row').forEach(row => {
            const inputs = row.querySelectorAll('input');
            if(inputs[0].value) {
                payload.ingredients.push({
                    name: inputs[0].value,
                    quantity: inputs[1].value || 0,
                    price_per_pack: inputs[2].value || 0,
                    pack_size: 1
                });
            }
        });

        const response = await fetch('/api/calculate-product', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status === 'success') {
            document.getElementById('emptyResults').style.display = 'none';
            document.getElementById('resultsCard').style.display = 'block';

            document.getElementById('resTotalCost').innerText = data.total_variable_cost + ' DA';
            document.getElementById('resProfit').innerText = data.profit_per_unit + ' DA';
            document.getElementById('resMargin').innerText = data.profit_margin_percentage + '%';

            updateChart(data);
        }
    }

    function updateChart(data) {
        const ctx = document.getElementById('resultChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Ingrédients', 'Main d\'œuvre', 'Packaging'],
                datasets: [{
                    data: [data.ingredient_cost_with_loss, data.labor_cost, data.packaging_cost],
                    backgroundColor: ['#667eea', '#764ba2', '#ffc107']
                }]
            }
        });
    }
</script>
{% endblock %}
